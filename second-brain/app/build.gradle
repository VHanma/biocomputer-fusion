plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hanma.echocore'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hanma.echocore.neural.omega'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '5.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
