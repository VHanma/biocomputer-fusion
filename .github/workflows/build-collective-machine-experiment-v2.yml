name: Build Collective Machine Experiment V2 APK

on:
  push:
    branches:
      - collective-machine-experiment-v2
    paths:
      - 'collective-machine-experiment/**'
      - '.github/workflows/build-collective-machine-experiment-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p collective-machine-experiment :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp collective-machine-experiment/app/build/outputs/apk/debug/app-debug.apk CollectiveMachineExperimentV2.apk
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CollectiveMachineExperimentV2-APK
          path: CollectiveMachineExperimentV2.apk
      - name: Publish V2 release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view collective-machine-experiment-v2-latest >/dev/null 2>&1; then
            gh release upload collective-machine-experiment-v2-latest CollectiveMachineExperimentV2.apk --clobber
          else
            gh release create collective-machine-experiment-v2-latest CollectiveMachineExperimentV2.apk \
              --title "Collective Machine Experiment V2 - Latest" \
              --notes "Multimodal recursive collective experiment: voice, rhythm, reaction, movement, text, drawing, personal baselines, synchronized rounds, collective latent core, controls, and feedback loop. Local processing; raw audio is discarded." \
              --target "${GITHUB_SHA}"
          fi
