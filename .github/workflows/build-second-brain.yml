name: Build EchoCore Living Minds v18 APK
on:
  push:
    branches: [ "second-brain-build", "ascendant-build" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: second-brain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Civilization Vault corpus
        run: python3 tools/build_civilization_vault.py
      - name: Verify Civilization Vault corpus
        run: |
          python3 - <<'PY'
          import sqlite3, pathlib
          p=pathlib.Path('app/src/main/assets/civilization_vault.db')
          if not p.exists() or p.stat().st_size < 65536:
              raise SystemExit('Civilization Vault database missing or too small')
          c=sqlite3.connect(p)
          sources=c.execute('select count(*) from sources').fetchone()[0]
          passages=c.execute('select count(*) from passages').fetchone()[0]
          full=c.execute("select count(*) from sources where source_type='PUBLIC_DOMAIN_FULLTEXT'").fetchone()[0]
          maps=c.execute("select count(*) from sources where source_type='KNOWLEDGE_MAP'").fetchone()[0]
          chars=c.execute('select coalesce(sum(char_count),0) from passages').fetchone()[0]
          print({'bytes':p.stat().st_size,'sources':sources,'passages':passages,'full_text_books':full,'knowledge_maps':maps,'chars':chars})
          if sources < 35 or passages < 100 or full < 12 or maps < 15 or chars < 500000:
              raise SystemExit('Civilization Vault verification floor not met')
          c.close()
          PY
      - name: Stamp Living Minds v18
        run: |
          sed -i -E 's/VERSION="[0-9]+\.[0-9]+\.[0-9]+"/VERSION="18.0.0"/' app/src/main/java/com/hanma/echocore/AscendantLinkService.java
          sed -i 's/Deep Ingest v17 City Gate/Living Minds City Gate/g' app/src/main/java/com/hanma/echocore/AscendantLinkService.java
          sed -i 's/Deep Ingest City Gate/Living Minds City Gate/g' app/src/main/java/com/hanma/echocore/AscendantLinkService.java
          sed -i 's/SOURCE CORTEX v17 · page-stream OCR ingestion/SOURCE CORTEX v18 · metabolized deep ingestion/' app/src/main/java/com/hanma/echocore/SourceActivity.java
          sed -i 's/SOURCE CORTEX v16 · verified deep ingestion/SOURCE CORTEX v18 · metabolized deep ingestion/' app/src/main/java/com/hanma/echocore/SourceActivity.java
          sed -i 's/DOCFLOW v10 · persistent resumable ingestion/SOURCE CORTEX v18 · metabolized deep ingestion/' app/src/main/java/com/hanma/echocore/SourceActivity.java
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify Living Minds v18 APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'civilization_vault.db'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EchoCore-Living-Minds-v18
          path: second-brain/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
