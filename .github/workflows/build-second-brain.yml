name: Build EchoCore Deep Ingest v16 APK
on:
  push:
    branches: [ "second-brain-build", "ascendant-build" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: second-brain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Civilization Vault corpus
        run: python3 tools/build_civilization_vault.py
      - name: Verify Civilization Vault corpus
        run: |
          python3 - <<'PY'
          import sqlite3, pathlib
          p=pathlib.Path('app/src/main/assets/civilization_vault.db')
          if not p.exists() or p.stat().st_size < 65536:
              raise SystemExit('Civilization Vault database missing or too small')
          c=sqlite3.connect(p)
          sources=c.execute('select count(*) from sources').fetchone()[0]
          passages=c.execute('select count(*) from passages').fetchone()[0]
          full=c.execute("select count(*) from sources where source_type='PUBLIC_DOMAIN_FULLTEXT'").fetchone()[0]
          maps=c.execute("select count(*) from sources where source_type='KNOWLEDGE_MAP'").fetchone()[0]
          chars=c.execute('select coalesce(sum(char_count),0) from passages').fetchone()[0]
          print({'bytes':p.stat().st_size,'sources':sources,'passages':passages,'full_text_books':full,'knowledge_maps':maps,'chars':chars})
          if sources < 35 or passages < 100 or full < 12 or maps < 15 or chars < 500000:
              raise SystemExit('Civilization Vault verification floor not met')
          c.close()
          PY
      - name: Stamp Deep Ingest v16
        run: |
          sed -i -E 's/VERSION="[0-9]+\.[0-9]+\.[0-9]+"/VERSION="16.0.0"/' app/src/main/java/com/hanma/echocore/AscendantLinkService.java
          sed -i 's/Continuum City Gate/Deep Ingest City Gate/g' app/src/main/java/com/hanma/echocore/AscendantLinkService.java
          sed -i 's/EchoCore Ω Continuum/EchoCore Ω Deep Ingest/g' app/src/main/java/com/hanma/echocore/AscendantLinkService.java
          sed -i 's/DOCFLOW v10 · persistent resumable ingestion/SOURCE CORTEX v16 · verified deep ingestion/' app/src/main/java/com/hanma/echocore/SourceActivity.java
          sed -i 's/NEXUS HUB/CITY HUB/' app/src/main/java/com/hanma/echocore/SourceActivity.java
          sed -i 's/safeStart(CloudLinkActivity.class)/safeStart(SanctumActivity.class)/' app/src/main/java/com/hanma/echocore/SourceActivity.java
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/main/java/com/hanma/echocore/SourceActivity.java')
          s=p.read_text()
          old=re.search(r'    private android\.view\.View sourceCard\(String\[\] s\)\{.*?\n\n    private void openOriginal',s,re.S)
          if not old:
              raise SystemExit('sourceCard method not found')
          new='''    private android.view.View sourceCard(String[] s){
              long id=Long.parseLong(s[0]);String name=s[1],mime=s[2],uri=s[3];int chars=Integer.parseInt(s[5]),chunks=Integer.parseInt(s[6]);String state=s.length>9?s[9]:(chunks>0?"READY":"INCOMPLETE"),err=s.length>10?s[10]:"";
              LinearLayout c=card();c.addView(text(name,14,TEXT,true));int stateColor="READY".equals(state)?ACCENT2:("FAILED".equals(state)?DANGER:("INGESTING".equals(state)?WARM:MUTED));c.addView(text(state+" · "+mime+" · "+chars+" chars · "+chunks+" chunks",10,stateColor,true),lp(-1,-2,0,3,0,3));if(!err.isEmpty())c.addView(text(err,9,DANGER,false),lp(-1,-2,0,2,0,6));
              LinearLayout row=new LinearLayout(this);row.setOrientation(LinearLayout.HORIZONTAL);
              if(chunks>0){Button sum=button("SUMMARIZE",PANEL2,ACCENT2);sum.setOnClickListener(v->summarizeSource(id,name));row.addView(sum,new LinearLayout.LayoutParams(0,dp(41),1));}
              else if(uri!=null&&!uri.isEmpty()){Button retry=button("RECOVER",PANEL2,WARM);retry.setOnClickListener(v->{catalog.deleteSource(id);ArrayList<Uri> one=new ArrayList<>();one.add(Uri.parse(uri));queue(one);});row.addView(retry,new LinearLayout.LayoutParams(0,dp(41),1));}
              if(uri!=null&&!uri.isEmpty()){Button open=button("OPEN",PANEL2,ACCENT);open.setOnClickListener(v->openOriginal(uri,mime));LinearLayout.LayoutParams q=new LinearLayout.LayoutParams(0,dp(41),1);q.setMargins(dp(6),0,0,0);row.addView(open,q);}Button del=button("REMOVE",0xFF28161C,DANGER);del.setOnClickListener(v->new AlertDialog.Builder(this).setTitle("Remove source catalog?").setMessage("Neural memories already learned from it stay in the brain.").setNegativeButton("Keep",null).setPositiveButton("Remove",(d,w)->{catalog.deleteSource(id);render();}).show());LinearLayout.LayoutParams q=new LinearLayout.LayoutParams(0,dp(41),1);q.setMargins(dp(6),0,0,0);row.addView(del,q);c.addView(row);return c;}

    private void openOriginal'''
          s=s[:old.start()]+new+s[old.end():]
          p.write_text(s)
          PY
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify Deep Ingest classes
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'civilization_vault.db'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EchoCore-Deep-Ingest-v16
          path: second-brain/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
