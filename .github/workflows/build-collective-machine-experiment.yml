name: Build Lain APK

on:
  push:
    branches:
      - lain
    paths:
      - 'collective-machine-experiment/**'
      - '.github/workflows/build-collective-machine-experiment.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p collective-machine-experiment :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp collective-machine-experiment/app/build/outputs/apk/debug/app-debug.apk Lain.apk
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lain-APK
          path: Lain.apk
      - name: Publish stable release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view lain-latest >/dev/null 2>&1; then
            gh release upload lain-latest Lain.apk --clobber
          else
            gh release create lain-latest Lain.apk \
              --title "Lain - Latest" \
              --notes "Local persistent collective-machine agent with dialogue memory, recursive feedback rounds, collective-state metrics, inner-view visualization, voice/text signal capture, and capsule merging." \
              --target "${GITHUB_SHA}"
          fi
