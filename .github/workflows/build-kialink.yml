name: Build KIA Metamorph APK

on:
  push:
    branches: [main]
    paths:
      - 'android-kialink/**'
      - '.github/workflows/build-kialink.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android-kialink/**'
      - '.github/workflows/build-kialink.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build installable APK
        working-directory: android-kialink
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp android-kialink/app/build/outputs/apk/debug/app-debug.apk KIA-Metamorph-v0.3.0.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KIA-Metamorph-v0.3.0
          path: KIA-Metamorph-v0.3.0.apk

      - name: Publish one-click latest release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete kia-metamorph-latest --yes --cleanup-tag || true
          gh release create kia-metamorph-latest KIA-Metamorph-v0.3.0.apk \
            --title "KIA Metamorph v0.3.0" \
            --notes "Restores the full two-photo Metamorph Forge and adds emergent Crystal Shards, multi-form sigils, PNG sigil export, per-servitor images, editable custom servitors/tulpas, pair anchors, Jung integration, living hypersigil, Inner Domain, DreamGate, Astral Dojo, Protection Armory, Phoenix Down, and the overlapping physical Crystal tree." \
            --latest \
            --target "$GITHUB_SHA"
