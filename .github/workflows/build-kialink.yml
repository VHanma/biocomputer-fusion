name: Build KIA Link APK

on:
  push:
    branches: [main]
    paths:
      - 'android-kialink/**'
      - '.github/workflows/build-kialink.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android-kialink/**'
      - '.github/workflows/build-kialink.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build installable APK
        working-directory: android-kialink
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp android-kialink/app/build/outputs/apk/debug/app-debug.apk KIA-Link-v0.1.0.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KIA-Link-v0.1.0
          path: KIA-Link-v0.1.0.apk

      - name: Publish one-click latest release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete kia-link-latest --yes --cleanup-tag || true
          gh release create kia-link-latest KIA-Link-v0.1.0.apk \
            --title "KIA Link v0.1.0" \
            --notes "Offline two-photo chaos sigil, gnosis, invocation and integration engine." \
            --latest \
            --target "$GITHUB_SHA"
