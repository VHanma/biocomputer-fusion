[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biocomputer-fusion"
version = "0.1.0"
description = "Programmable biocomputer simulator with DNA memory, gene-circuit logic, metabolic state, nano-interface, evolutionary search, and optional wave-field metaphor."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Biocomputer Fusion Contributors"}
]
keywords = ["biocomputing", "dna-storage", "synthetic-biology", "simulation", "nanotechnology", "cellular-automata"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Artificial Life"
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
biocomputer = "biocomputer_fusion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
